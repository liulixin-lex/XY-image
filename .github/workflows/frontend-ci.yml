name: Frontend CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.26.2
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @loomic/shared build
      - name: Check web types
        run: pnpm --filter @loomic/web typecheck
      - name: Test web
        run: pnpm --filter @loomic/web test
      # next.config.ts no longer ignores type errors, so this also fails on
      # any type error the static export would otherwise ship.
      - name: Build static export
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SERVER_BASE_URL: https://api.example.test
          NEXT_PUBLIC_SUPABASE_URL: https://db.example.test
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          NEXT_PUBLIC_XY2API_WEB_URL: https://www.example.test
        run: pnpm --filter @loomic/web build
